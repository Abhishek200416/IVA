[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iva-engine"
version = "1.7.29"
description = "IVA — Autonomous Cognitive Engineering Partner, Systems Architect & Multi-Agent Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Abhishek"}
]
keywords = ["iva", "cognitive-agent", "autonomous-partner", "multi-agent", "sandbox", "sqlite-wal", "ci-repair"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
iva = "run_iva:main"
talk-to-iva = "talk_to_iva:main"
agi17 = "run_iva:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iva*", "agents.AGI_1_7*"]

[tool.setuptools.package-data]
"agents.AGI_1_7.ecosystem.agent_registry.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "agents/AGI_1_7/backups",
    "agents/AGI_1_7/heldout_benchmark_workspace",
    "agents/AGI_1_7/live_code_mission_workspace",
    "agents/AGI_1_7/demo_workspace",
    "node_modules",
    ".venv",
    ".gemini",
]

