[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agi-17-omega-command"
version = "1.7.0"
description = "AGI 1.7 OMEGA COMMAND — Resource-Aware, Sandboxed, Multi-Agent Coding & CI-Repair Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Abhishek"}
]
keywords = ["ai-agents", "coding-agent", "ci-repair", "sandbox", "sqlite-wal", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agi17 = "agents.AGI_1_7.run_agi_17:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agents.AGI_1_7*"]

[tool.setuptools.package-data]
"agents.AGI_1_7.ecosystem.agent_registry.contracts" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["agents/AGI_1_7/tests"]
norecursedirs = [
    "agents/AGI_1_7/backups",
    "agents/AGI_1_7/heldout_benchmark_workspace",
    "agents/AGI_1_7/live_code_mission_workspace",
    "agents/AGI_1_7/demo_workspace",
    "node_modules",
    ".venv",
    ".gemini",
]

