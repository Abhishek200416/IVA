name: IVA — Verification & CI Suite

on:
  push:
    branches: [ main, "feat/**", "sec/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: "Run optional paid live-model smoke check (requires configured runner credentials)"
        required: false
        default: "false"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify-iva-runtime:
    name: Verify 100 Specialists, Sandbox Security & Runtime Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Package in Editable Mode (PEP 621 pyproject.toml Verification)
        run: python -m pip install -e .

      - name: Verify Zero Secret Leaks & Zero Hardcoded Local Paths
        run: python -m unittest tests/test_production_hardening_sprint.py -v

      - name: Run Iva Cognitive Architecture & Identity Verification Suite
        run: python -m unittest tests/test_iva_cognitive_architecture_and_identity.py -v

      - name: Run P0 Production Security Hardening & Docker Sandbox Tests
        run: python -m unittest tests/test_p0_security_and_real_docker.py -v

      - name: Run Adversarial Model-Disclosure Boundary & Secret Redaction Tests
        run: python -m unittest tests/test_model_disclosure_boundary.py -v

      - name: Run Finance Safety Invariants & Pre-Trade RMS Control Tests
        run: python -m unittest tests/test_finance_safety_invariants.py -v

      - name: Verify 100 Specialist Contracts & Ecosystem Sync (Dry-Run, Zero Home Mutation)
        run: python agents/IVA/scripts/sync_ecosystem.py --dry-run

      - name: Verify EcosystemCoordinator Inventory (100 Specialists, >=76 Agency Profiles, 21 MCPs, 11 Plugins, 74 Skills)
        run: |
          python -c "from agents.IVA.ecosystem.agent_registry.ecosystem_coordinator import EcosystemCoordinator; c = EcosystemCoordinator(); inv = c.get_inventory_summary(); print(inv); assert inv['embedded_specialists_count'] == 100; assert inv['agency_profiles_bridged_count'] >= 76; assert inv['mcp_servers_count'] == 21; assert inv['plugin_suites_count'] == 11; assert inv['workflow_skills_count'] == 74"

      - name: Run IVA Unit Test Suite (26 Tests)
        run: python -m unittest tests/unit/test_iva_unit_suite.py -v

      - name: Run IVA Integration Test Suite (16 Tests)
        run: python -m unittest tests/integration/test_iva_integration_suite.py -v

      - name: Run IVA End-to-End Demo Test Suite (7 Tests)
        run: python -m unittest tests/end_to_end/test_iva_e2e_demos.py -v

      - name: Run Generated Workspace Unit Test Suites (TokenBucket & IntervalMerger)
        run: |
          python -m unittest discover -s agents/IVA/live_code_mission_workspace -t agents/IVA/live_code_mission_workspace -p "test_*.py" -v
          python -m unittest discover -s agents/IVA/demo_workspace/src -t agents/IVA/demo_workspace/src -p "test_*.py" -v

      - name: Run CLI Startup & Capability Profile Smoke Check
        run: python run_iva.py --profile-only

  verify-real-docker-sandbox-linux:
    name: Real Docker Engine Container Isolation & Security Proof (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Package in Editable Mode
        run: python -m pip install -e .

      - name: Pull & Verify Pinned Production Container Image Digest
        run: |
          docker pull python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
          docker image inspect python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1 --format "{{json .RepoDigests}}"

      - name: Execute Real Docker Engine Integration & Adversarial Sandbox Proofs
        env:
          IVA_REQUIRE_REAL_DOCKER: "1"
        run: python -m unittest tests.test_p0_security_and_real_docker.TestP0RealDockerEngineIntegration -v
